version: '3.8'

services:
  jenkins:
    image: jenkins/jenkins:2.426.3-lts-jdk21
    container_name: jenkins-pipeline
    ports:
      - "8080:8080"
      - "50000:50000"
    environment:
      JENKINS_OPTS: "--httpPort=8080"
      JAVA_OPTS: "-Xmx1024m -Xms1024m"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PWD}:/workspace
    networks:
      - jenkins-network

  postgres:
    image: postgres:15-alpine
    container_name: bank-postgres
    environment:
      POSTGRES_DB: bank_onboarding
      POSTGRES_USER: bank_user
      POSTGRES_PASSWORD: bank_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - jenkins-network

volumes:
  jenkins_home:
  postgres_data:

networks:
  jenkins-network:
    driver: bridge

