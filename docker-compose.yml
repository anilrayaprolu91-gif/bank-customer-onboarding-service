
services:

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: onboarding_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       onboarding_db
      POSTGRES_USER:     onboarding_user
      POSTGRES_PASSWORD: onboarding_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onboarding_user -d onboarding_db"]
      interval: 10s
      timeout:  5s
      retries:  5
      start_period: 20s
    networks:
      - onboarding_net

  # ── Kafka (Redpanda) ─────────────────────────────────────────────────────────
  kafka:
    image: redpandadata/redpanda:v24.1.14
    container_name: onboarding_kafka
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://kafka:9092
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - onboarding_net

  # ── Application ───────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: onboarding_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DB_HOST:     postgres
      DB_PORT:     5432
      DB_NAME:     onboarding_db
      DB_USERNAME: onboarding_user
      DB_PASSWORD: onboarding_pass
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      APP_KAFKA_ENABLED: true
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout:  10s
      retries:  5
      start_period: 60s
    networks:
      - onboarding_net

  # ── pgAdmin (optional dev tool) ───────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: onboarding_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL:    admin@bank.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - onboarding_net
    profiles:
      - tools    # only started with: docker compose --profile tools up

volumes:
  postgres_data:

networks:
  onboarding_net:
    driver: bridge

