spring:
  application:
    name: bank-customer-onboarding-service

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: com.bank.onboarding.event
        spring.json.value.default.type: com.bank.onboarding.event.CustomerOnboardedEvent
    listener:
      missing-topics-fatal: false
    admin:
      auto-create: true

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:onboarding_db}
    username: ${DB_USERNAME:onboarding_user}
    password: ${DB_PASSWORD:onboarding_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: OnboardingHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        default_batch_fetch_size: 50
        order_inserts: true
        order_updates: true
        jdbc:
          batch_size: 50

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    out-of-order: false

server:
  port: 8080
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: application/json
  error:
    include-message: always
    include-binding-errors: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
  show-actuator: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,flyway
      base-path: /actuator
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

info:
  app:
    name: Bank Customer Onboarding Service
    version: 1.0.0
    description: Production-grade banking customer onboarding microservice

app:
  kafka:
    enabled: ${APP_KAFKA_ENABLED:false}
    customer-onboarded-topic: ${APP_KAFKA_CUSTOMER_ONBOARDED_TOPIC:customer.onboarded.v1}
    consumer-group-id: ${APP_KAFKA_CONSUMER_GROUP_ID:bank-onboarding-service}

logging:
  level:
    root: INFO
    com.bank.onboarding: INFO
    org.springframework.web: INFO
    org.flywaydb: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

