# Spring Boot overrides specifically for when running inside Docker Compose.
# Merged on top of application.yml when SPRING_PROFILES_ACTIVE=docker.
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:onboarding_db}
    username: ${DB_USERNAME:onboarding_user}
    password: ${DB_PASSWORD:onboarding_pass}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}

app:
  kafka:
    enabled: ${APP_KAFKA_ENABLED:true}

logging:
  level:
    root: INFO
    com.bank.onboarding: INFO

